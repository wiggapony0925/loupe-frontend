name: OTA update (JS-only changes)

# MANUAL ONLY. Previously ran on every push to main alongside publish-ios.yml.
#
# The comment that used to live here claimed the companion native build was
# "a no-op if the fingerprint is unchanged". That was never true of a plain
# `type: build` job — it rebuilt unconditionally, and that is what ran up the
# build bill. Skipping on an unchanged fingerprint requires an explicit
# fingerprint -> get_build -> conditional build chain.
#
# EAS Update is a separate meter from EAS Build (billed by monthly active
# users, not per job) and the app still points at u.expo.dev, so dispatching
# this by hand is cheap. Existing installs degrade gracefully if it never
# runs: expo-updates falls back to the bundle embedded in the last build.

on:
  workflow_dispatch: {}

jobs:
  update:
    name: EAS Update -> production channel
    type: update
    params:
      branch: production
      message: ${{ github.event.head_commit.message }}
      platform: all
