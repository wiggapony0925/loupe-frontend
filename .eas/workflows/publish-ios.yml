name: Publish iOS (TestFlight)

# MANUAL ONLY. This used to run on every push to main, which turned each
# commit into a paid EAS build — 83 builds in one cycle, of which only 3
# had a distinct native fingerprint. Builds are now done locally instead:
#   npm run build:ios     (see scripts/build-ios-local.sh)
#
# Kept, un-triggered, so EAS remains a one-click fallback if a local build
# is ever blocked. Running it requires an active EAS plan and bills per build.

on:
  workflow_dispatch: {}

jobs:
  build_ios:
    name: Build iOS production
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit to TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
