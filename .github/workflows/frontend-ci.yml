name: frontend-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same ref.
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate set-logo registry
        # The registry is git-ignored in CI but referenced by source.
        # Same script runs in eas-build-pre-install.
        run: node scripts/generate-set-logo-registry.mjs || true

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The consumer half of consumer-driven contracts. This does NOT publish —
      # it asserts that contracts/loupe-frontend.contract.json still describes
      # this app, i.e. that every endpoint the source calls is declared.
      #
      # Without it the contract rots the quiet way: someone adds a call, never
      # adds a contract entry, and the backend's can-i-deploy gate keeps passing
      # green while being free to delete the endpoint underneath us. A contract
      # that silently stops covering the app is worse than no contract, because
      # the green check is trusted.
      #
      # When this fails: add the endpoint to the contract and run
      # `npm run contract:publish`, then commit the published copy in
      # loupe-backend so its CI verifies against the new surface.
      - name: Contract still describes this app
        run: npm run contract:ci

      - name: Test
        run: npm run test:ci

      - name: Integration tests (Vitest + MSW)
        run: npm run test:integration
